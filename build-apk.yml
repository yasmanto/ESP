name: Build APK Android

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Elektronik-Sensus-Pelepah.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elektronik-Sensus-Pelepah-APK
          path: Elektronik-Sensus-Pelepah.apk
          if-no-files-found: error
          retention-days: 30
