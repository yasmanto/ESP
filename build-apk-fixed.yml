name: Build APK Android
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Elektronik-Sensus-Pelepah.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elektronik-Sensus-Pelepah-APK
          path: Elektronik-Sensus-Pelepah.apk
